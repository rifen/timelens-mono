name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core
        continue-on-error: true

  publish-vscode:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Prepare core for bundling
        run: |
          rm -rf packages/vscode/node_modules/@rifen/timescope-core
          mkdir -p packages/vscode/node_modules/@rifen
          cp -r packages/core/dist packages/vscode/node_modules/@rifen/timescope-core
          cp packages/core/package.json packages/vscode/node_modules/@rifen/timescope-core/

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx vsce package

      - name: Verify VSIX contents
        run: |
          VSIX=$(ls packages/vscode/*.vsix | head -n1)
          echo "Checking $VSIX"
          unzip -l "$VSIX" | grep -i "node_modules/@rifen/timescope-core/dist" || (echo "Core not bundled!" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          cd packages/vscode
          npx vsce publish -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
