name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core --ignore-scripts --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core

  publish-vscode:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Bump VS Code extension version to match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cd packages/vscode
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies --out timescope.vsix

      - name: Publish to VS Code Marketplace (OIDC)
        run: |
          cd packages/vscode
          npx @vscode/vsce publish --azure-credential --no-dependencies
