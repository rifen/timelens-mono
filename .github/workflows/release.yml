name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    outputs:
      core_version: ${{ steps.core-version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core --ignore-scripts --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Determine core version from tag
        id: core-version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Check if tag version already exists on npm
          if npm view @rifen/timescope-core@$TAG_VERSION version 2>/dev/null; then
            echo "ERROR: Version $TAG_VERSION already exists on npm. Use a new tag."
            exit 1
          fi

          NEW_VERSION="$TAG_VERSION"
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set core package version
        run: |
          cd packages/core
          pnpm version "${{ steps.core-version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core

  publish-vscode:
    runs-on: ubuntu-latest
    needs: publish-core
    env:
      AZURE_CLIENT_ID: "25fc354e-62e5-4c49-94a4-504bdbc8fcf6"
      AZURE_TENANT_ID: "c9318c73-07d0-475c-8bb5-81872494e6e5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Determine VS Code extension version from tag
        id: vscode-version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Check if tag version already exists on marketplace
          # vsce show returns 0 even when not found, so check output
          OUTPUT=$(npx @vscode/vsce show rifen.rifen-timescope@$TAG_VERSION version 2>&1 || true)
          if echo "$OUTPUT" | grep -q "^$TAG_VERSION$"; then
            echo "ERROR: Version $TAG_VERSION already exists on marketplace. Use a new tag."
            exit 1
          fi
          echo "vsce output: $OUTPUT"

          NEW_VERSION="$TAG_VERSION"
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set VS Code extension version
        run: |
          cd packages/vscode
          pnpm version "${{ steps.vscode-version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies --out timescope.vsix

      - name: Publish to VS Code Marketplace (OIDC)
        run: |
          cd packages/vscode
          npx @vscode/vsce publish --azure-credential --no-dependencies
