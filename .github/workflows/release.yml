name: Publish Core Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core
