name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core
        continue-on-error: true

  publish-vscode:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Compile VS Code extension
        run: |
          cd packages/vscode
          npm run compile

      - name: Stage extension for packaging
        run: |
          # Create clean staging directory
          rm -rf /tmp/timescope-vscode-staging
          mkdir -p /tmp/timescope-vscode-staging

          # Copy extension manifest and metadata
          cp packages/vscode/package.json /tmp/timescope-vscode-staging/
          cp packages/vscode/README.md /tmp/timescope-vscode-staging/
          cp packages/vscode/CHANGELOG.md /tmp/timescope-vscode-staging/
          cp packages/vscode/LICENSE /tmp/timescope-vscode-staging/
          cp packages/vscode/.vscodeignore /tmp/timescope-vscode-staging/
          cp packages/vscode/tsconfig.json /tmp/timescope-vscode-staging/

          # Copy source and compiled extension (src needed for vsce prepublish compile step)
          cp -r packages/vscode/src /tmp/timescope-vscode-staging/
          cp -r packages/vscode/dist /tmp/timescope-vscode-staging/

          # Copy core runtime dependency (compiled JS only, no symlinks)
          mkdir -p /tmp/timescope-vscode-staging/node_modules/@rifen/timescope-core
          cp -r packages/core/dist /tmp/timescope-vscode-staging/node_modules/@rifen/timescope-core/
          cp packages/core/package.json /tmp/timescope-vscode-staging/node_modules/@rifen/timescope-core/

          # Fix package.json: replace workspace:* with file: reference for local core package
          sed -i 's|"@rifen/timescope-core": "workspace:\*"|"@rifen/timescope-core": "file:./node_modules/@rifen/timescope-core"|' /tmp/timescope-vscode-staging/package.json

      - name: Install staging dependencies
        run: |
          cd /tmp/timescope-vscode-staging
          pnpm install --ignore-scripts

      - name: Package VS Code extension
        run: |
          cd /tmp/timescope-vscode-staging
          npx @vscode/vsce package --out timescope.vsix

      - name: Verify VSIX contents
        run: |
          unzip -l /tmp/timescope-vscode-staging/timescope.vsix | grep -i "node_modules/@rifen/timescope-core/dist" || (echo "Core not bundled!" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/timescope-vscode-staging/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          cd /tmp/timescope-vscode-staging
          npx @vscode/vsce publish -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
