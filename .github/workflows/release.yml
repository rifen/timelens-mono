name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    outputs:
      core_version: ${{ steps.core-version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --filter @rifen/timescope-core --ignore-scripts --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rifen/timescope-core run build

      - name: Determine core version
        id: core-version
        run: |
          # Get latest published version from npm
          LATEST=$(npm view @rifen/timescope-core version 2>/dev/null || echo "0.0.0")
          echo "Latest published: $LATEST"
          
          # If triggered by tag, use tag version; otherwise auto-increment patch
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag version: $TAG_VERSION"
            
            # Check if tag version already exists
            if npm view @rifen/timescope-core@$TAG_VERSION version 2>/dev/null; then
              echo "Version $TAG_VERSION already exists, incrementing patch..."
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              NEW_VERSION="$TAG_VERSION"
            fi
          else
            # Auto-increment patch from latest
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set core package version
        run: |
          cd packages/core
          npm version "${{ steps.core-version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/core

  publish-vscode:
    runs-on: ubuntu-latest
    needs: publish-core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Determine VS Code extension version
        id: vscode-version
        run: |
          # Get latest published version from marketplace
          LATEST=$(npx @vscode/vsce show rifen.rifen-timescope version 2>/dev/null || echo "0.0.0")
          echo "Latest published: $LATEST"
          
          # Use same version as core for consistency
          CORE_VERSION="${{ needs.publish-core.outputs.core_version }}"
          if [[ -n "$CORE_VERSION" ]]; then
            NEW_VERSION="$CORE_VERSION"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag version: $TAG_VERSION"
            if npx @vscode/vsce show rifen.rifen-timescope@$TAG_VERSION version 2>/dev/null; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              NEW_VERSION="$TAG_VERSION"
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "Publishing version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set VS Code extension version
        run: |
          cd packages/vscode
          npm version "${{ steps.vscode-version.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies --out timescope.vsix

      - name: Publish to VS Code Marketplace (OIDC)
        run: |
          cd packages/vscode
          npx @vscode/vsce publish --azure-credential --no-dependencies