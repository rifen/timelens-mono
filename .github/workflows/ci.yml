name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Run core tests
        run: pnpm --filter @rifen/timescope-core test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Prepare core for bundling
        run: |
          rm -rf packages/vscode/node_modules/@rifen/timescope-core
          mkdir -p packages/vscode/node_modules/@rifen
          cp -r packages/core/dist packages/vscode/node_modules/@rifen/timescope-core
          cp packages/core/package.json packages/vscode/node_modules/@rifen/timescope-core/

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx vsce package

      - name: Verify VSIX contents
        run: |
          VSIX=$(ls packages/vscode/*.vsix | head -n1)
          echo "Checking $VSIX"
          unzip -l "$VSIX" | grep -i "node_modules/@rifen/timescope-core/dist" || (echo "Core not bundled!" && exit 1)

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: timescope-vscode
          path: packages/vscode/*.vsix
