name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Run core tests
        run: pnpm --filter @rifen/timescope-core test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r run build

      - name: Compile VS Code extension
        run: |
          cd packages/vscode
          npm run compile

      - name: Stage extension for packaging
        run: |
          # Create clean staging directory
          rm -rf /tmp/timescope-vscode-staging
          mkdir -p /tmp/timescope-vscode-staging

          # Copy extension manifest and metadata
          cp packages/vscode/package.json /tmp/timescope-vscode-staging/
          cp packages/vscode/README.md /tmp/timescope-vscode-staging/
          cp packages/vscode/CHANGELOG.md /tmp/timescope-vscode-staging/
          cp packages/vscode/LICENSE /tmp/timescope-vscode-staging/
          cp packages/vscode/.vscodeignore /tmp/timescope-vscode-staging/
          cp packages/vscode/tsconfig.json /tmp/timescope-vscode-staging/

          # Copy source and compiled extension (src needed for vsce prepublish compile step)
          cp -r packages/vscode/src /tmp/timescope-vscode-staging/
          cp -r packages/vscode/dist /tmp/timescope-vscode-staging/
          # Copy extension folder for icon
          cp -r packages/vscode/extension /tmp/timescope-vscode-staging/

          # Fix package.json: replace workspace:* with absolute file: reference to workspace core package
          # This allows pnpm to properly install the core package from the workspace
          sed -i 's|"@rifen/timescope-core": "workspace:\*"|"@rifen/timescope-core": "file:${{ github.workspace }}/packages/core"|' /tmp/timescope-vscode-staging/package.json

          # Remove vscode:prepublish script to prevent vsce from running tsc (we already compiled)
          # This avoids needing devDependencies like @types/vscode in the staging install
          sed -i 's|"vscode:prepublish": "npm run compile"|"vscode:prepublish": ""|' /tmp/timescope-vscode-staging/package.json
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install staging dependencies
        run: |
          cd /tmp/timescope-vscode-staging
          pnpm install --ignore-scripts --prod

          # Strip devDependencies from ALL packages in node_modules
          # vsce runs `npm list --production` and fails if ANY package declares missing devDependencies
          node -e "
            const fs = require('fs');
            const path = require('path');
            function stripDevDeps(dir) {
              const pkgPath = path.join(dir, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                if (pkg.devDependencies) {
                  delete pkg.devDependencies;
                }
                if (pkg.scripts) {
                  delete pkg.scripts;
                }
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
            // Walk all packages in node_modules
            const modulesDir = '/tmp/timescope-vscode-staging/node_modules';
            const entries = fs.readdirSync(modulesDir);
            for (const entry of entries) {
              const entryPath = path.join(modulesDir, entry);
              if (fs.statSync(entryPath).isDirectory()) {
                // Check for scoped packages (e.g., @rifen, @blackwell-systems)
                if (entry.startsWith('@')) {
                  const scopedEntries = fs.readdirSync(entryPath);
                  for (const scopedEntry of scopedEntries) {
                    stripDevDeps(path.join(entryPath, scopedEntry));
                  }
                } else {
                  stripDevDeps(entryPath);
                }
              }
            }
          "

      - name: Package VS Code extension
        run: |
          cd /tmp/timescope-vscode-staging
          npx @vscode/vsce package --out timescope.vsix

      - name: Verify VSIX contents
        run: |
          unzip -l /tmp/timescope-vscode-staging/timescope.vsix | grep -i "node_modules/@rifen/timescope-core/dist" || (echo "Core not bundled!" && exit 1)

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: timescope-vscode
          path: /tmp/timescope-vscode-staging/*.vsix
